---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: "https://argocd.wiersma.tech"
  kustomize.buildOptions: "--enable-helm"
  dex.config: |
    connectors:
      - type: google
        id: google
        name: Google
        config:
          clientID: $google-oidc:client_id
          clientSecret: $google-oidc:client_secret
          redirectURI: https://argocd.wiersma.tech/api/dex/callback
